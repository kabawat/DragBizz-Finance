syntax = "proto3";

package utility;

import "google/protobuf/struct.proto";

enum EmailTemplate {
  EMAIL_TEMPLATE_UNSPECIFIED = 0;
  EMAIL_TEMPLATE_OTP = 1;
  EMAIL_TEMPLATE_WELCOME = 2;
  EMAIL_TEMPLATE_RESET_PASSWORD = 3;
  EMAIL_TEMPLATE_STORE_DELETE_OTP = 4;
  EMAIL_TEMPLATE_LOGIN_SUCCESS = 5;
  EMAIL_TEMPLATE_SUBSCRIPTION_SUCCESS = 6;
  EMAIL_TEMPLATE_CUSTOM = 7;
  EMAIL_TEMPLATE_INVOICE_CREATED = 8;
  EMAIL_TEMPLATE_ORDER_STATUS_UPDATE = 9;
  EMAIL_TEMPLATE_ORDER_OTP = 10;
  EMAIL_TEMPLATE_STAFF_INVITATION = 11;
  EMAIL_TEMPLATE_PAYMENT_REMINDER = 12;
  EMAIL_TEMPLATE_LOW_STOCK_ALERT = 13;
}

message SendEmailRequest {
  string to = 1;
  EmailTemplate type = 2;
  google.protobuf.Struct payload = 3;
}

message SendEmailResponse {
  bool success = 1;
  string message = 2;
  string job_id = 3;
  string to = 4;
  string type = 5;
  string status = 6;
}
