syntax = "proto3";

package retailer.retailPayment;

message StoreAddress {
  string line1 = 1;
  string line2 = 2;
  string city = 3;
  string state = 4;
  string pincode = 5;
  string country = 6;
}

message StoreDetails {
  string id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  StoreAddress address = 5;
}

message CustomerDetails {
  string id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
}

message GatewayCredentials {
  string keyId = 1;
  string keySecret = 2;
  string webhookSecret = 3;
  string clientId = 4;
  string clientSecret = 5;
  string publishableKey = 6;
  string secretKey = 7;
}

