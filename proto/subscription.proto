syntax = "proto3";

package subscription;

option go_package = "subscription";

// ============================================================================
// Common Messages
// ============================================================================

message Empty {}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// ============================================================================
// Usage Service Messages
// ============================================================================

message CheckUsageRequest {
  string user_id = 1;
  string feature_key = 2;
  int32 quantity = 3;
  string agency_id = 4;
}

message UsageQuota {
  bool has_access = 1;
  int32 remaining = 2;
  int32 limit = 3;
  string usage_type = 4;
  int32 used = 5;
  int32 daily_limit = 6;
  int32 monthly_limit = 7;
  int32 monthly_used = 8;
}

message CheckUsageResponse {
  bool allowed = 1;
  string reason = 2;
  UsageQuota quota = 3;
  Error error = 4;
}

message IncrementUsageRequest {
  string user_id = 1;
  string feature_key = 2;
  int32 quantity = 3;
  map<string, string> metadata = 4;
  string agency_id = 5;
}

message UsageRecord {
  int32 count = 1;
  string date = 2;
  string month = 3;
  int32 year = 4;
}

message IncrementUsageResponse {
  bool success = 1;
  UsageRecord usage = 2;
  UsageQuota quota = 3;
  Error error = 4;
}

message GetQuotaRequest {
  string user_id = 1;
  string feature_key = 2;
  string agency_id = 3;
}

message GetQuotaResponse {
  bool success = 1;
  UsageQuota quota = 2;
  Error error = 3;
}

// ============================================================================
// Subscription Service Messages
// ============================================================================

message Feature {
  string feature_key = 1;
  string feature_name = 2;
  bool enabled = 3;
  UsageLimits usage_limits = 4;
  map<string, string> metadata = 5;
}

message UsageLimits {
  string usage_type = 1;
  int32 total_limit = 2;
  int32 custom_daily_limit = 3;
}

message Pricing {
  int32 months = 1;
  double price = 2;
  double discount = 3;
  double discounted_price = 4;
}

message FeatureUsageLimit {
  string feature_key = 1;
  bool enabled = 2;
  string usage_type = 3;
  int32 total_limit = 4;
  int32 custom_daily_limit = 5;
  string feature_name = 6;
  map<string, string> metadata = 7;
}

message Package {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Pricing pricing = 4;
  repeated FeatureUsageLimit feature_usage_limits = 5;
}

message Payment {
  string id = 1;
  double amount = 2;
  string currency = 3;
  string status = 4;
}

message GetActiveSubscriptionRequest {
  string user_id = 1;
  string agency_id = 2;
}

message GetActiveSubscriptionResponse {
  bool success = 1;
  string id = 2;
  string user_id = 3;
  Package package = 4;
  Payment payment = 5;
  string status = 6;
  string billing_cycle = 7;
  string start_date = 8;
  string end_date = 9;
  string trial_end_date = 10;
  bool auto_renew = 11;
  string next_billing_date = 12;
  repeated Feature features = 13;
  int32 max_subscribers_snapshot = 14;
  Error error = 15;
}

// ============================================================================
// Services
// ============================================================================

service UsageService {
  rpc CheckUsage(CheckUsageRequest) returns (CheckUsageResponse);
  rpc IncrementUsage(IncrementUsageRequest) returns (IncrementUsageResponse);
  rpc GetQuota(GetQuotaRequest) returns (GetQuotaResponse);
}

service SubscriptionService {
  rpc GetActiveSubscription(GetActiveSubscriptionRequest) returns (GetActiveSubscriptionResponse);
}

