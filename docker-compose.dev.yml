services:
  dragbizz-subscription-dev:
    build: .
    container_name: dragbizz_subscription_dev
    ports:
      - "${PORT:-4002}:${PORT:-4002}"
      - "${GRPC_PORT:-50052}:50052"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-4002}
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - GRPC_PORT=${GRPC_PORT:-50052}
    command: sh -c "yarn install && yarn dev"
    volumes:
      - .:/app
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis-dev
    # Development settings
    stdin_open: true
    tty: true
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  redis-dev:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription_redis_dev
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb"]
    volumes:
      - redis_dev_data:/data
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'

volumes:
  redis_dev_data:
    driver: local

networks:
  default:
    name: dragbizz_subscription_dev_network
