version: "3.8"

services:
  dragbizz-subscription-dev:
    build: .
    container_name: dragbizz_subscription_dev
    ports:
      - "${PORT:-4002}:${PORT:-4002}"
    env_file:
      - env.development
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-4002}
    command: sh -c "yarn install && yarn dev"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo-dev
      - redis-dev
    # Development settings
    stdin_open: true
    tty: true
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  mongo-dev:
    image: mongo:7.0
    container_name: dragbizz_subscription_mongo_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: subs_dev
      MONGO_INITDB_ROOT_PASSWORD: dev_password_123
    volumes:
      - mongo_dev_data:/data/db
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  redis-dev:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription_redis_dev
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb"]
    volumes:
      - redis_dev_data:/data
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.05'

volumes:
  mongo_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  default:
    name: dragbizz_subscription_dev_network
