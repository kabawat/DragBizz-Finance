services:
  dragbizz-subscription:
    build: .
    container_name: db-finance
    ports:
    - ${HOST_HTTP_PORT:-8002}:${PORT:-3000}
    - ${HOST_GRPC_PORT:-5002}:${FINANCE_PORT:-5002}
    env_file:
    - .env
    command: sh -c "yarn install && yarn dev"
    volumes:
    - .:/app
    - /app/node_modules
    extra_hosts:
    - host.docker.internal:host-gateway
    - dragbizz.local:host-gateway
    networks:
    - subscription-network
    - redis-private
    stdin_open: true
    tty: true
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_DB: '0'
      REDIS_USERNAME: finance_user
    stop_grace_period: 45s
networks:
  subscription-network:
    driver: bridge
  redis-private:
    name: ${REDIS_NETWORK_NAME:-redis-private}
    external: true
