version: "3.9"

services:
  dragbizz-subscription-staging:
    build: .
    container_name: dragbizz_subscription_staging
    ports:
      - "${PORT:-4002}:${PORT:-4002}"
    env_file:
      - env.staging
    environment:
      - NODE_ENV=staging
      - PORT=${PORT:-4012}
    command: sh -c "yarn install && yarn start"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo-staging
      - redis-staging
    stdin_open: true
    tty: true
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  mongo-staging:
    image: mongo:7.0
    container_name: dragbizz_subscription_mongo_staging
    environment:
      MONGO_INITDB_ROOT_USERNAME: subs_staging
      MONGO_INITDB_ROOT_PASSWORD: staging_password_123
    volumes:
      - mongo_staging_data:/data/db
    # No external port exposure in staging
    restart: "unless-stopped"

  redis-staging:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription_redis_staging
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb"]
    volumes:
      - redis_staging_data:/data
    # No external port exposure in staging
    restart: "unless-stopped"

volumes:
  mongo_staging_data:
    driver: local
  redis_staging_data:
    driver: local

