name: dragbizz-finance-prod
services:
  dragbizz-subscription:
    build:
      context: .
      dockerfile: Dockerfile
    image: dragbizz-subscription:prod
    container_name: finance
    restart: unless-stopped
    ports:
    - ${HOST_HTTP_PORT:-8002}:3000
    - ${HOST_GRPC_PORT:-5002}:5002
    env_file:
    - .env
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
    - subscription-network
    - redis-private
    stop_grace_period: 45s
networks:
  subscription-network:
    driver: bridge
  redis-private:
    name: redis-private
    external: true
