services:
  dragbizz-subscription:
    build:
      context: .
      dockerfile: Dockerfile
    image: dragbizz-subscription:prod
    container_name: dragbizz_subscription
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8002}:${PORT:-3000}"   # REST
      - "${HOST_GRPC_PORT:-5002}:${GRPC_PORT:-50052}"  # gRPC
    env_file:
      - .env
    environment:
      - GRPC_HOST=${GRPC_HOST:-0.0.0.0}
      - GRPC_PORT=${GRPC_PORT:-50052}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dragbizz.local:host-gateway"
    depends_on:
      - redis
    networks:
      - subscription-network

  redis:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - subscription-network

volumes:
  redis_data:

networks:
  subscription-network:
    driver: bridge
