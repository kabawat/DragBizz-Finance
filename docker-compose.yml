services:
  dragbizz-subscription:
    build:
      context: .
      dockerfile: Dockerfile
    image: dragbizz-subscription:prod
    container_name: dragbizz_subscription
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-8002}:${PORT:-3000}"          # REST: 8002 on host
      - "${HOST_GRPC_PORT:-5002}:${FINANCE_PORT:-5002}"  # gRPC: 5002 on host
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "dragbizz.local:host-gateway"
    depends_on:
      - redis
    networks:
      - subscription-network

  redis:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - subscription-network

volumes:
  redis_data:

networks:
  subscription-network:
    driver: bridge
