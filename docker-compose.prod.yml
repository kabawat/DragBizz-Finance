version: "3.9"

services:
  dragbizz-subscription-prod:
    build: .
    container_name: dragbizz_subscription_prod
    ports:
      - "${PORT:-4002}:${PORT:-4002}"
    env_file:
      - env.production
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4011}
    command: sh -c "yarn install --production && yarn start"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - redis-prod
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-4002}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-prod:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription_redis_prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    # No external port exposure in production
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_prod_data:
    driver: local

