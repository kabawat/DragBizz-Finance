version: "3.9"

services:
  dragbizz-subscription-prod:
    build: .
    container_name: dragbizz_subscription_prod
    ports:
      - "4011:4011"
    env_file:
      - env.production
    environment:
      - NODE_ENV=production
      - PORT=4011
      - MONGODB_URI=mongodb://subs_prod:prod_password_123@mongo-prod:27017/dragbizz_subscription_prod?authSource=admin
      - REDIS_HOST=redis-prod
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - AUTH_SERVER_URL=${AUTH_SERVER_URL}
    command: sh -c "yarn install --production && yarn start"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongo-prod
      - redis-prod
    restart: "unless-stopped"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo-prod:
    image: mongo:7.0
    container_name: dragbizz_subscription_mongo_prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: subs_prod
      MONGO_INITDB_ROOT_PASSWORD: prod_password_123
    volumes:
      - mongo_prod_data:/data/db
    # No external port exposure in production
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis-prod:
    image: redis:7.2-alpine
    container_name: dragbizz_subscription_redis_prod
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_prod_data:/data
    # No external port exposure in production
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_prod_data:
    driver: local
  redis_prod_data:
    driver: local

